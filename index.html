\x3C!-- Script de Animação dos Botões -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const botoes = document.querySelectorAll('.btn-animado');

        botoes.forEach(btn => {
            btn.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-3px) scale(1.02)';
            });
            btn.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0) scale(1)';
            });

            btn.addEventListener('click', function(e) {
                let ripple = document.createElement('span');
                let rect = this.getBoundingClientRect();
                let x = e.clientX - rect.left;
                let y = e.clientY - rect.top;

                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                ripple.style.position = 'absolute';
                ripple.style.transform = 'translate(-50%, -50%)';
                ripple.style.backgroundColor = 'rgba(255, 255, 255, 0.6)';
                ripple.style.width = '0px';
                ripple.style.height = '0px';
                ripple.style.borderRadius = '50%';
                ripple.style.pointerEvents = 'none';
                ripple.style.transition = 'width 0.6s ease-out, height 0.6s ease-out, opacity 0.6s ease-out';

                this.appendChild(ripple);

                setTimeout(() => {
                    ripple.style.width = '300px';
                    ripple.style.height = '300px';
                    ripple.style.opacity = '0';
                }, 10);

                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });
    });

                ripple.style.position = 'absolute';

                ripple.style.backgroundColor = 'rgba(255, 255, 255, 0.6)';
                ripple.style.width = '0px';
                ripple.style.height = '0px';

                ripple.style.pointerEvents = 'none';
                ripple.style.transition = 'width 0.6s ease-out, height 0.6s ease-out, opacity 0.6s ease-out';

                this.appendChild(ripple);

                setTimeout(() => {
                    ripple.style.width = '300px';
                    ripple.style.height = '300px';
                    ripple.style.opacity = '0';
                }, 10);

                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });

    transform: translateY(-1px);

    0% { opacity: 1; }

    100% { opacity: 0; }
  }

    0% { transform: scale(1); box-shadow: 0 10px 20px rgba(6,215,160,0.3); }

  }
  .btn-pulse {
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes toastIn {
    0% { opacity: 0; transform: translate(-50%, 20px); }
    100% { opacity: 1; transform: translate(-50%, 0); }
  }

    0% { opacity: 1; transform: translate(-50%, 0); }

    box-shadow: 0 10px 30px rgba(240,71,112,0.4);
    z-index: 9999;

    animation: toastOut 0.3s ease forwards;
